name: test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22"]
        php-version: ["8.4"]
        composer-version: ["v2.2"]

    steps:
      - uses: actions/checkout@v4
      # node
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # php
      - name: Setup PHP with ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:${{ matrix.composer-version }}

      # do not use composer install --optimize-autoloader due permission issue
      # Error: RecursiveDirectoryIterator::__construct(//var/lock/lvm): Failed to open directory: Permission denied
      - name: Prepare project's build
        run: |
          composer run test production
          composer run setup production
          composer run build production

          # .gitignore directory not reachable
          mv .build build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/*

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
      - name: Deploy to...
        run: |
          ls -l
          du -hs .
